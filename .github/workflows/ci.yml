name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-safety:
    name: Runtime safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runtime plans, activation recovery, and offline package updates
        run: python -m unittest discover -s tests/python -t tests -p "test_runtime_core_*.py"
      - name: Verify runtime pruning and preparation probes
        run: |
          python -m unittest discover -s tests/python -t tests -p "test_runtime_pruning.py"
          python -m unittest discover -s tests/python -t tests -p "test_prepare_runtime_probe.py"
      - name: Verify optional components preserve the fixed runtime
        run: python -m unittest discover -s tests/python -t tests -p "test_worker_optional_packages.py"

  macos-updater:
    name: macOS updater
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive generation and platform-specific installation
        run: |
          python -m unittest discover -s tests/python -t tests -p 'test_macos_update_release.py'
          cargo test --manifest-path src-tauri/Cargo.toml macos_update
          cargo test --manifest-path src-tauri/Cargo.toml single_instance
          cargo test --manifest-path src-tauri/Cargo.toml bundled_bootstrap_uses_user_overlay_without_changing_bundle

  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r python/requirements-ci.txt

      - name: Run all tests
        run: pnpm test:all

      - name: Build frontend
        run: pnpm build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
